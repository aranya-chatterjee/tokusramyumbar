<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Toku's Ramyum Bar</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <style>
    @font-face { font-family: 'Shojumaru'; src: url('/fonts/shojumaru-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Outfit'; font-weight: 400; src: url('/fonts/outfit-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Outfit'; font-weight: 600; src: url('/fonts/outfit-600.woff2') format('woff2'); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: #fbeee4; color: #1c1214; font: 17px/1.5 'Outfit', system-ui, sans-serif; text-align: center; }
    main { max-width: 440px; display: grid; justify-items: center; gap: 14px; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { margin: 0; font: 400 clamp(2.2rem, 9vw, 3.2rem)/1.05 'Shojumaru', serif; color: #b8143a; }
    p { margin: 0; color: #5b4a4d; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    a.btn { font-weight: 600; text-decoration: none; padding: 12px 20px; border-radius: 999px; background: #b8143a; color: #fff; }
    a.btn.alt { background: transparent; color: #b8143a; border: 2px solid #b8143a; }
    a.btn:focus-visible { outline: 3px solid #1c1214; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/img/brand/logo-104.png" alt="Toku's">
    <h1>Bowl not found</h1>
    <p>This page slurped itself up. The link may be old or mistyped.</p>
    <div class="btns">
      <a class="btn" href="/">Go to the home page</a>
      <a class="btn alt" href="/#book">Book a table</a>
    </div>
  </main>
</body>
</html>
